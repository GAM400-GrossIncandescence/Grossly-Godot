name: ✦ If only I could Grossly build Godot ✦

on:
    pull_request:

jobs:
    verify-build:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        permissions:
            contents: write
            
        steps:
            - name: checkout current repo
              uses: actions/checkout@v7
            
            - name: initial configuration
              run: |
                pip install scons
            
            - name: setting up cache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: set NugetSource
              run: |
                $target_dir = Join-Path $env:LOCALAPPDATA "LocalNugetSource"
                New-Item -ItemType Directory -Force -Path $target_dir
                
                dotnet nuget add source $target_dir --name LocalNugetSource
            
            - name: build editor binaries
              env: 
                SCCACHE_GHA_ENABLED: "true"
              run: |
                python misc\scripts\install_accesskit.py
                python misc\scripts\install_d3d12_sdk_windows.py
                scons platform=windows target=editor module_mono_enabled=yes use_llvm=yes
            
            - name: build export templates
              env: 
                SCCACHE_GHA_ENABLED: "true"
              run: |
                scons platform=windows target=template_debug module_mono_enabled=yes
                scons platform=windows target=template_release module_mono_enabled=yes

            - name: generate glue
              run: |
                bin/godot.windows.editor.x86_64.llvm.mono --headless --generate-mono-glue modules/mono/glue

            - name: building .NET assemblies
              env: 
                SCCACHE_GHA_ENABLED: "true"
              run: |
                $target_dir = Join-Path $env:LOCALAPPDATA "LocalNugetSource"
                python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows --push-nupkgs-local $target_dir

            - name: configuring release zip
              shell: powershell
              run: |
                $source_path = Join-Path $env:LOCALAPPDATA "LocalNugetSource"
                $target_path = Join-Path $env:GITHUB_WORKSPACE "Release"
                $zip_path = Join-Path $env:GITHUB_WORKSPACE "Release.zip"
                
                New-Item -ItemType Directory -Force -Path $target_path | Out-Null

                Copy-Item -Path (Join-Path $source_path "*.snupkg")  -Destination $target_path -Force
                Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "bin/*.exe") -Destination $target_path -Force
                Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "bin/GodotSharp") -Destination $target_path -Recurse -Force
                
                Compress-Archive -Path (Join-Path $target_path "*") -DestinationPath $zip_path -Force
            
            - name: creating release 
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release create "grossly-godot-${{ github.run_number}}" "$env:GITHUB_WORKSPACE\Grossly-Godot-Release.zip" \
                --title "Grossly Godot Release" \
                --notes "The latest release of Grossly Godot ✦"
